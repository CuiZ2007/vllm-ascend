# Local A3 accuracy case derived from Kimi-K3-W4A8-EP256-A5.yaml.
# Model: Kimi-K3 W4A8 MXFP/QuaRot, pre-pruned to 256 routed experts.
# Hardware: one A3 node, 8 dual-chip cards / 16 visible NPU chips, TP16 + EP.
# Mount /data/c30087248 at the same absolute path inside the test container.
# Requires all 16 chips and working HCCL communication.
# Provision compatible Kimi-K3/MXFP kernels, V2 runner, tokenizer and AISBench.
# Runtime support and TP16 compatibility have not been validated on A3.
# Unset HCCL_OP_EXPANSION_MODE before launching the test harness.
# Dataset: first 500 GSM8K test records plus train.jsonl for stock 4-shot CoT.
# Keep dataset basename gsm8k and omit the trailing slash for tools/aisbench.py.
# Preserves A5 eager execution and sampling settings for comparison.
# Inherited acceptance: 60.0% +/-3.0 percentage points; not calibrated on A3.
# Static validation only; no model startup or accuracy run has been performed.
# Local case only: not registered in the A3 nightly matrix.
test_cases:
- name: Kimi-K3-W4A8-EP256-A3-GSM8K-First500
  model: /data/c30087248/weights/Kimi-K3-w4a8-mxfp-QuaRot-experts256
  envs:
    SERVER_PORT: "8080"
    VLLM_USE_V2_MODEL_RUNNER: '1'
    HCCL_BUFFSIZE: '800'
    PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
    OMP_NUM_THREADS: '1'
    VLLM_ENGINE_READY_TIMEOUT_S: '7200'
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '3000'
  server_cmd:
  - --host
  - 0.0.0.0
  - --trust-remote-code
  - --tokenizer-mode
  - kimi_k3
  - --quantization
  - ascend
  - --generation-config
  - vllm
  - --reasoning-parser
  - kimi_k3
  - --tensor-parallel-size
  - '16'
  - --enable-expert-parallel
  - --dtype
  - bfloat16
  - --enforce-eager
  - --max-model-len
  - '6144'
  - --max-num-seqs
  - '100'
  - --max-num-batched-tokens
  - '2048'
  - --enable-chunked-prefill
  - --gpu-memory-utilization
  - '0.85'
  - --no-enable-prefix-caching
  - --mm-processor-cache-gb
  - '0'
  - --limit-mm-per-prompt
  - '{"vision_chunk":0}'
  - --additional-config
  - '{"enable_flashcomm1":true}'
  - --seed
  - '42'
  - --port
  - $SERVER_PORT
  - --default-chat-template-kwargs
  - '{"thinking_effort":"low"}'
  test_content: []
  benchmarks:
    accuracy:
      case_type: accuracy
      dataset_path: /data/c30087248/datasets/first500/gsm8k
      dataset_path_local: /data/c30087248/datasets/first500/gsm8k
      request_conf: vllm_api_general_chat
      dataset_conf: gsm8k/gsm8k_gen_4_shot_cot_str
      num_prompts: 500
      max_out_len: 1024
      batch_size: 60
      temperature: 0
      top_p: 1.0
      seed: 42
      baseline: 60.0
      threshold: 3.0
