# Functional checks only: first 500 raw GSM8K questions, concurrency 60, one round.
# No answer-accuracy or throughput gate; all 500 HTTP responses must pass validation.
test_cases:
- name: Kimi-K3-W4A8-E256-A3-Functional-First500
  model: /root/.cache/modelscope/hub/models/CuiZ2007/Kimi-K3-w4a8-experts256
  envs:
    SERVER_PORT: '8080'
    VLLM_USE_V2_MODEL_RUNNER: '1'
    HCCL_BUFFSIZE: '800'
    PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
    OMP_NUM_THREADS: '1'
    VLLM_ENGINE_READY_TIMEOUT_S: '7200'
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '3000'
  server_cmd:
  - --host
  - 0.0.0.0
  - --trust-remote-code
  - --tokenizer-mode
  - kimi_k3
  - --quantization
  - ascend
  - --generation-config
  - vllm
  - --reasoning-parser
  - kimi_k3
  - --tensor-parallel-size
  - '16'
  - --enable-expert-parallel
  - --dtype
  - bfloat16
  - --enforce-eager
  - --max-model-len
  - '4096'
  - --max-num-seqs
  - '100'
  - --max-num-batched-tokens
  - '2048'
  - --enable-chunked-prefill
  - --gpu-memory-utilization
  - '0.85'
  - --no-enable-prefix-caching
  - --mm-processor-cache-gb
  - '0'
  - --limit-mm-per-prompt
  - '{"vision_chunk":0}'
  - --additional-config
  - '{"enable_flashcomm1":true}'
  - --seed
  - '42'
  - --port
  - $SERVER_PORT
  - --default-chat-template-kwargs
  - '{"thinking_effort":"low"}'
  test_content: []
  benchmarks:
    gsm8k_first500_c60_functional:
      case_type: functional
      repeat_count: 1
      dataset_path: /root/.cache/modelscope/hub/datasets/CuiZ2007/gsm8k
      dataset_path_local: /root/.cache/modelscope/hub/datasets/CuiZ2007/gsm8k
      num_prompts: 500
      batch_size: 60
      max_out_len: 1024
      temperature: 0
      top_p: 1.0
      seed: 42
      request_timeout: 300
  test_rounds: 1
