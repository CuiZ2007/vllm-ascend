# One A3 node, 16 NPUs: TP16 / DP1 / EP16, mixed prefill/decode.
# Reference: Kimi-K3-MRV2-A3.yaml (model options and GPQA settings).
# Set model to the absolute directory of the pruned checkpoint before running.
# The checkpoint must already contain 256 experts and matching quantization metadata.
# No speculative model is needed: evaluate the pruned target model directly.
test_cases:
  - name: "Kimi-K3-W4A8-Experts256-A3-GPQA"
    model: "Kimi-K3-w4a8-experts256"
    envs:
      VLLM_USE_V2_MODEL_RUNNER: "1"
      HCCL_BUFFSIZE: "800"
      PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
      OMP_PROC_BIND: "false"
      OMP_NUM_THREADS: "1"
      TASK_QUEUE_ENABLE: "1"
      VLLM_ENGINE_READY_TIMEOUT_S: "7200"
      SERVER_PORT: "DEFAULT_PORT"
    server_cmd:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "$SERVER_PORT"
      - "--quantization"
      - "ascend"
      - "--safetensors-load-strategy"
      - "prefetch"
      - "--trust-remote-code"
      - "--tokenizer-mode"
      - "kimi_k3"
      - "--tensor-parallel-size"
      - "16"
      - "--data-parallel-size"
      - "1"
      - "--distributed-executor-backend"
      - "mp"
      - "--enable-expert-parallel"
      - "--enable-prefix-caching"
      - "--max-num-seqs"
      - "4"
      - "--max-model-len"
      - "32768"
      - "--max-num-batched-tokens"
      - "8192"
      - "--gpu-memory-utilization"
      - "0.9"
      - "--seed"
      - "42"
      - "--compilation-config"
      - '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[1,2,4],"max_cudagraph_capture_size":4}'
      - "--additional-config"
      - '{"enable_cpu_binding":true,"enable_flashcomm1":true}'
      - "--mm-processor-cache-gb"
      - "0"
      - "--mm-encoder-tp-mode"
      - "data"
      - "--limit-mm-per-prompt"
      - '{"vision_chunk":0}'
      - "--reasoning-parser"
      - "kimi_k3"
    test_content: []
    benchmarks:
      acc_gpqa:
        case_type: accuracy
        dataset_path: vllm-ascend/gpqa
        request_conf: vllm_api_general_chat
        dataset_conf: gpqa/gpqa_gen_0_shot_cot_chat_prompt
        # Match the existing K3 case's sample count for initial comparison.
        num_prompts: 30
        max_out_len: 24576
        batch_size: 4
        thinking: true
        temperature: 1.0
        top_p: 0.95
        # Reference-model baseline, NOT a measured experts256 result.
        # Recalibrate baseline and tolerance after the first validated run.
        baseline: 93
        threshold: 3
