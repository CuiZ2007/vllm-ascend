# Draft: A3/A5 hardware validation and performance baseline calibration are pending.
# Warmup and measured rounds have separate artifact groups; do not aggregate warmup metrics.
# Prefill-focused: 2048-token input, one output token, prefix caching enabled, no speculative decoding.
# Cache-enabled short-output workload: repeated/shared prompts can skip prefill; not a cold-prefill baseline.
test_name: Kimi-K3-W4A8-E256-A5-PD-main-Perf-PureP
model: /root/.cache/modelscope/hub/models/CuiZ2007/Kimi-K3-w4a8-mxfp-QuaRot-experts256
num_nodes: 2
npu_per_node: 8
dp_load_balancing: external
routing:
  type: disaggregated_prefill
  groups:
    prefiller:
    - 0
    decoder:
    - 1
config:
- node_index: 0
  port_start: 8100
  dp_rpc_port: 13389
  dp_size: 1
  dp_size_local: 1
  dp_rank_start: 0
  tp_size: 8
  dp_address: ${NODE_0_IP}
- node_index: 1
  port_start: 8100
  dp_rpc_port: 13390
  dp_size: 1
  dp_size_local: 1
  dp_rank_start: 0
  tp_size: 8
  dp_address: ${NODE_1_IP}
templates:
- node_index: 0
  envs:
    VLLM_USE_V2_MODEL_RUNNER: '1'
    HCCL_OP_EXPANSION_MODE: CCU_SCHED
    HCCL_BUFFSIZE: '800'
    PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
    OMP_NUM_THREADS: '1'
    PYTHONHASHSEED: '42'
    VLLM_ENGINE_READY_TIMEOUT_S: '7200'
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '3000'
    VLLM_HOST_IP: ${LOCAL_IP}
    SERVER_PORT: ${PORT}
    ASCEND_RT_VISIBLE_DEVICES: ${VISIBLE_DEVICES}
    LD_LIBRARY_PATH: /usr/local/Ascend/ascend-toolkit/latest/python/site-packages/mooncake:$LD_LIBRARY_PATH
    TORCH_EXTENSIONS_DIR: /tmp/task4_kimi_k3_main_performance_purep/node-${NODE_INDEX}/dp-${DP_RANK}
  server_cmd_template:
  - --host
  - 0.0.0.0
  - --port
  - $SERVER_PORT
  - --data-parallel-size
  - ${DP_SIZE}
  - --data-parallel-rank
  - ${DP_RANK}
  - --data-parallel-address
  - ${DP_ADDRESS}
  - --data-parallel-rpc-port
  - ${DP_RPC_PORT}
  - --tensor-parallel-size
  - ${TP_SIZE}
  - --enable-expert-parallel
  - --distributed-executor-backend
  - mp
  - --trust-remote-code
  - --tokenizer-mode
  - kimi_k3
  - --reasoning-parser
  - kimi_k3
  - --quantization
  - ascend
  - --dtype
  - bfloat16
  - --generation-config
  - vllm
  - --seed
  - '42'
  - --default-chat-template-kwargs
  - '{"thinking_effort":"low"}'
  - --enforce-eager
  - --max-model-len
  - '24576'
  - --max-num-seqs
  - '100'
  - --max-num-batched-tokens
  - '3072'
  - --enable-chunked-prefill
  - --block-size
  - '768'
  - --cp-kv-cache-interleave-size
  - '768'
  - --gpu-memory-utilization
  - '0.85'
  - --mm-processor-cache-gb
  - '0'
  - --limit-mm-per-prompt
  - '{"vision_chunk":0}'
  - --additional-config
  - '{"enable_flashcomm1":true}'
  - --kv-transfer-config
